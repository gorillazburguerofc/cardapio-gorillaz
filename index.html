<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital - Gorillaz Burguer</title>
    <style>
        :root {
            --primary: #f59e0b;
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-light: #f8fafc;
            --success: #10b981;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-light); 
            margin: 0; 
            padding: 0; 
            padding-bottom: 80px;
        }
        header { 
            background: #000; 
            padding: 20px; 
            text-align: center; 
            border-bottom: 3px solid var(--primary); 
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 { margin: 0; color: var(--primary); font-size: 24px;}
        header p { margin: 5px 0 0 0; color: #aaa; font-size: 14px;}
        
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        
        .category { 
            font-size: 1.2em; 
            font-weight: bold; 
            margin-top: 25px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 8px; 
            color: var(--primary); 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .item { 
            display: flex; 
            background: var(--bg-card); 
            padding: 15px; 
            margin-top: 12px; 
            border-radius: 8px; 
            border: 1px solid #2a2a2a;
            gap: 15px;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .item:active { transform: scale(0.98); }
        .item-img {
            width: 90px;
            height: 90px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #333;
            flex-shrink: 0;
        }
        .item-info { flex: 1; }
        .item-info h3 { margin: 0 0 5px 0; font-size: 16px; color: #fff;}
        .item-info p { 
            margin: 0; font-size: 13px; color: #94a3b8; line-height: 1.4; 
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .price { font-weight: bold; color: var(--success); font-size: 16px;}
        
        .btn-add { 
            background: var(--primary); 
            color: #000; 
            border: none; 
            padding: 8px 15px; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        
        .cart-bar { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            background: var(--primary); 
            color: #000; 
            padding: 18px; 
            text-align: center; 
            font-weight: bold; 
            cursor: pointer; 
            box-sizing: border-box; 
            font-size: 1.1em; 
            display: none; 
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
            z-index: 999;
        }
        
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.85); 
            z-index: 1000; 
            overflow-y: auto;
        }
        .modal-content { 
            background: var(--bg-card); 
            max-width: 500px; 
            margin: 0 auto; 
            min-height: 100vh;
            padding: 20px; 
            box-sizing: border-box;
            position: relative;
        }
        .close { 
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px; 
            cursor: pointer; 
            color: var(--primary); 
            line-height: 1;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 0 10px;
            border-radius: 50%;
        }
        
        .addon-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed #333;
        }
        .addon-item label { 
            margin: 0; color: #fff; font-size: 15px; display: flex; align-items: center; gap: 10px; cursor: pointer; 
        }
        .addon-item input[type="checkbox"] { 
            width: 20px; height: 20px; accent-color: var(--primary); margin: 0;
        }
        
        .cart-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start;
            margin-bottom: 15px; 
            border-bottom: 1px dashed #333; 
            padding-bottom: 15px; 
        }
        .cart-controls button {
            padding: 8px 12px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; }
        input, select { 
            width: 100%; 
            padding: 12px; 
            border-radius: 6px; 
            border: 1px solid #475569; 
            background: #0f172a; 
            color: white; 
            box-sizing: border-box;
            font-size: 16px;
        }
        
        .btn-send { 
            background: var(--success); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 18px; 
            font-size: 1.1em; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 20px;
            margin-bottom: 40px;
            position: sticky;
            bottom: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>🦍 GORILLAZ BURGUER</h1>
        <p>O melhor delivery de Parnaíba!</p>
    </header>
    
    <div class="container">
        <div id="menu-items">
            <p style="text-align: center; color: var(--primary); font-weight: bold;">Carregando cardápio direto da cozinha...</p>
        </div>
    </div>

    <div class="cart-bar" id="cart-bar" onclick="openCart()">
        🛒 Ver Pedido (<span id="cart-count">0</span>) - R$ <span id="cart-total-bar">0.00</span>
    </div>

    <!-- Modal Detalhes do Item -->
    <div class="modal" id="item-modal">
        <div class="modal-content" style="padding: 0;">
            <span class="close" onclick="closeItem()">&times;</span>
            <img id="detail-img" src="" style="width: 100%; height: 250px; object-fit: cover; border-bottom: 3px solid var(--primary);">
            
            <div style="padding: 20px;">
                <h2 id="detail-name" style="margin: 0 0 10px 0; color: #fff;"></h2>
                <p id="detail-desc" style="color: #94a3b8; font-size: 14px; line-height: 1.5; margin-bottom: 15px;"></p>
                <h3 style="color: var(--success); margin: 0 0 20px 0;">R$ <span id="detail-price"></span></h3>

                <div id="addons-container"></div>

                <div class="form-group" style="margin-top: 20px;">
                    <label>Alguma observação?</label>
                    <input type="text" id="detail-obs" placeholder="Ex: Tirar cebola, carne bem passada...">
                </div>

                <button class="btn-send" onclick="confirmItem()" id="btn-confirm-item">
                    Adicionar - R$ <span id="detail-total-btn">0.00</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Tela do Carrinho -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <span class="close" onclick="closeCart()">&times;</span>
            <h2 style="color: var(--primary); margin-top: 0;">Seu Pedido</h2>
            
            <div id="cart-items-list"></div>
            
            <h3 style="display: flex; justify-content: space-between; border-bottom: 2px solid #333; padding-bottom: 10px;">
                <span>Total:</span> 
                <span style="color: var(--success);">R$ <span id="cart-total-modal">0.00</span></span>
            </h3>
            
            <h3 style="color: var(--primary); margin-top: 25px;">Para Onde Vamos Mandar?</h3>
            <div class="form-group">
                <label>Seu Nome</label>
                <input type="text" id="c-name" placeholder="Como devemos te chamar?">
            </div>
            <div class="form-group">
                <label>Endereço Completo (Rua, Número, Bairro)</label>
                <input type="text" id="c-address" placeholder="Ex: Rua A, 123 - Centro">
            </div>
            
            <h3 style="color: var(--primary); margin-top: 25px;">Pagamento</h3>
            <div class="form-group">
                <label>Forma de Pagamento na Entrega</label>
                <select id="c-payment">
                    <option value="PIX">PIX</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
            </div>
            <div class="form-group" id="troco-div" style="display:none;">
                <label>Precisa de troco para quanto?</label>
                <input type="number" id="c-troco" placeholder="Ex: 50">
            </div>

            <button class="btn-send" onclick="sendOrder()">Enviar Pedido no WhatsApp 📱</button>
        </div>
    </div>

    <script>
        const phone = "5586994466786"; 
        // 👉 COLE O SEU ID AQUI ABAIXO
        const SHEET_ID = "1o-DiM4TXG8U--60V2oMdDYcngW9Lq9zEHsscflODR3Y"; 
        
        let menu = [];
        let adicionais = [];
        let cart = [];
        let currentItemView = null; 
        let currentItemBasePrice = 0;

        async function loadMenuFromSheet() {
            if (SHEET_ID === "COLE_SEU_ID_AQUI") {
                document.getElementById('menu-items').innerHTML = '<p style="text-align:center; color:#ef4444;">⚠️ Atenção Chefe! Coloque o ID da Planilha.</p>';
                return;
            }
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
                const response = await fetch(url);
                const text = await response.text();
                const jsonStr = text.substring(47).slice(0, -2);
                const data = JSON.parse(jsonStr);
                const rows = data.table.rows;
                
                const newMenu = [];
                const novosAdicionais = [];
                
                rows.forEach(row => {
                    if(!row.c[0] || row.c[0].v === null) return; 
                    const id = row.c[0].v;
                    const category = row.c[1] ? row.c[1].v.toString().trim() : 'Gorillaz Menu';
                    const name = row.c[2] ? row.c[2].v : '';
                    const desc = row.c[3] ? row.c[3].v.toString().trim() : '';
                    const price = row.c[4] ? parseFloat(row.c[4].v) : 0;
                    const disponivel = row.c[5] ? row.c[5].v : '';
                    const img = row.c[6] ? row.c[6].v : 'https://via.placeholder.com/150/1e1e1e/f59e0b?text=Gorillaz';
                    
                    if(disponivel.toString().toUpperCase() === 'SIM') {
                        if(category.toUpperCase() === 'ADICIONAIS') {
                            // O campo desc aqui serve como a nossa regra secreta de filtro
                            novosAdicionais.push({ id, nome: name, preco: price, desc: desc });
                        } else {
                            newMenu.push({ id, category, name, desc, price, img });
                        }
                    }
                });
                
                menu = newMenu;
                adicionais = novosAdicionais;
                renderMenu();
            } catch (error) {
                console.error("Erro:", error);
                document.getElementById('menu-items').innerHTML = '<p style="text-align:center; color:#ef4444;">Erro ao carregar o cardápio.</p>';
            }
        }

        function renderMenu() {
            let html = '';
            let currentCategory = '';
            
            if(menu.length === 0) {
                document.getElementById('menu-items').innerHTML = '<p style="text-align:center;">Nenhum produto disponível no momento.</p>';
                return;
            }
            
            menu.forEach(item => {
                if (item.category !== currentCategory) {
                    html += `<div class="category">${item.category}</div>`;
                    currentCategory = item.category;
                }
                html += `
                    <div class="item" onclick="openItem(${item.id})">
                        <img src="${item.img}" class="item-img" alt="${item.name}">
                        <div class="item-info">
                            <h3>${item.name}</h3>
                            <p>${item.desc}</p>
                            <div class="price-row">
                                <span class="price">R$ ${item.price.toFixed(2)}</span>
                                <span style="font-size: 12px; color: var(--primary);">Ver Detalhes ➜</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('menu-items').innerHTML = html;
        }

        function openItem(id) {
            const item = menu.find(i => i.id === id);
            currentItemView = item;
            currentItemBasePrice = item.price;

            document.getElementById('detail-img').src = item.img;
            document.getElementById('detail-name').innerText = item.name;
            document.getElementById('detail-desc').innerText = item.desc;
            document.getElementById('detail-price').innerText = item.price.toFixed(2);
            document.getElementById('detail-obs').value = '';

            // 👉 A MÁGICA ACONTECE AQUI: Filtra quais adicionais podem aparecer neste lanche
            let addonsHtml = '';
            let addonsPermitidos = adicionais.filter(add => {
                if (!add.desc) return true; // Se a descrição do adicional estiver vazia, vai para todos os lanches
                
                const regra = add.desc.toLowerCase();
                const nomeLanche = currentItemView.name.toLowerCase();
                const catLanche = currentItemView.category.toLowerCase();
                const idLanche = currentItemView.id.toString();
                
                // Se a regra escrita na planilha bater com o nome, categoria ou ID do lanche atual, ele aparece!
                return nomeLanche.includes(regra) || catLanche.includes(regra) || idLanche === regra;
            });

            if(addonsPermitidos.length > 0) {
                addonsHtml += `<h3 style="color: var(--primary); border-bottom: 1px solid #333; padding-bottom: 8px;">Turbine seu pedido! (Adicionais)</h3>`;
                addonsPermitidos.forEach((add) => {
                    addonsHtml += `
                        <div class="addon-item">
                            <label>
                                <input type="checkbox" class="addon-checkbox" value="${add.preco}" data-name="${add.nome}"> 
                                ${add.nome}
                            </label>
                            <span class="addon-price">+ R$ ${add.preco.toFixed(2)}</span>
                        </div>
                    `;
                });
            }
            
            document.getElementById('addons-container').innerHTML = addonsHtml;

            document.querySelectorAll('.addon-checkbox').forEach(chk => {
                chk.addEventListener('change', calculateItemTotal);
            });

            calculateItemTotal();
            
            document.getElementById('item-modal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function calculateItemTotal() {
            let total = currentItemBasePrice;
            document.querySelectorAll('.addon-checkbox:checked').forEach(chk => {
                total += parseFloat(chk.value);
            });
            document.getElementById('detail-total-btn').innerText = total.toFixed(2);
        }

        function closeItem() {
            document.getElementById('item-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function confirmItem() {
            let addons = [];
            let addonTotal = 0;
            
            document.querySelectorAll('.addon-checkbox:checked').forEach(chk => {
                addons.push({ nome: chk.getAttribute('data-name'), preco: parseFloat(chk.value) });
                addonTotal += parseFloat(chk.value);
            });

            let obs = document.getElementById('detail-obs').value.trim();
            let precoFinal = currentItemBasePrice + addonTotal;

            cart.push({
                cartId: Date.now(), 
                id: currentItemView.id,
                name: currentItemView.name,
                price: precoFinal,
                basePrice: currentItemBasePrice,
                qtd: 1,
                addons: addons,
                obs: obs
            });

            closeItem();
            updateCart();
        }

        function updateCart() {
            let count = 0; let total = 0;
            cart.forEach(item => { count += item.qtd; total += item.price * item.qtd; });
            
            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-total-bar').innerText = total.toFixed(2);
            document.getElementById('cart-total-modal').innerText = total.toFixed(2);
            
            document.getElementById('cart-bar').style.display = count > 0 ? 'block' : 'none';
            if(count === 0) closeCart();
            renderCartItems();
        }

        function renderCartItems() {
            let html = '';
            cart.forEach((item, index) => {
                let extrasHtml = '';
                if(item.addons.length > 0) {
                    extrasHtml += `<div style="font-size: 12px; color: var(--primary); margin-top: 4px;">+ ${item.addons.map(a => a.nome).join(', ')}</div>`;
                }
                if(item.obs) {
                    extrasHtml += `<div style="font-size: 12px; color: #cbd5e1; font-style: italic;">Obs: ${item.obs}</div>`;
                }

                html += `
                    <div class="cart-item">
                        <div style="flex: 1; padding-right: 15px;">
                            <div style="font-weight: bold; color: #fff;">${item.name}</div>
                            ${extrasHtml}
                            <div style="color: var(--success); font-weight: bold; margin-top: 5px;">
                                R$ ${(item.price * item.qtd).toFixed(2)} 
                                <span style="color: #64748b; font-size: 12px; font-weight: normal;">(R$ ${item.price.toFixed(2)} un)</span>
                            </div>
                        </div>
                        <div class="cart-controls">
                            <button onclick="changeQtd(${index}, -1)">-</button>
                            <span style="margin: 0 10px; font-weight: bold;">${item.qtd}</span>
                            <button onclick="changeQtd(${index}, 1)">+</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('cart-items-list').innerHTML = html || '<p style="color: #64748b;">Seu carrinho está vazio.</p>';
        }

        function changeQtd(index, delta) {
            cart[index].qtd += delta;
            if (cart[index].qtd <= 0) cart.splice(index, 1);
            updateCart();
        }

        function openCart() { 
            document.getElementById('cart-modal').style.display = 'block'; 
            document.body.style.overflow = 'hidden'; 
        }
        
        function closeCart() { 
            document.getElementById('cart-modal').style.display = 'none'; 
            document.body.style.overflow = 'auto';
        }

        document.getElementById('c-payment').addEventListener('change', function() {
            document.getElementById('troco-div').style.display = this.value === 'Dinheiro' ? 'block' : 'none';
        });

        function sendOrder() {
            const name = document.getElementById('c-name').value.trim();
            const address = document.getElementById('c-address').value.trim();
            const payment = document.getElementById('c-payment').value;
            const troco = document.getElementById('c-troco').value;

            if (!name || !address) {
                alert("🦍 Chefe, preencha seu nome e endereço para a gente entregar!");
                return;
            }

            let text = "🦍 *NOVO PEDIDO - GORILLAZ BURGUER* 🦍%0A%0A";
            text += "*🛒 ITENS DO PEDIDO:*%0A";
            let total = 0;
            
            cart.forEach(item => {
                text += `▪️ *${item.qtd}x ${item.name}* - R$ ${(item.price * item.qtd).toFixed(2)}%0A`;
                if(item.addons.length > 0) {
                    text += `   ↳ _Extras: ${item.addons.map(a => a.nome).join(', ')}_%0A`;
                }
                if(item.obs) {
                    text += `   ↳ _Obs: ${item.obs}_%0A`;
                }
                total += item.price * item.qtd;
            });
            
            text += `%0A*💰 TOTAL:* R$ ${total.toFixed(2)}%0A`;
            text += `*💳 PAGAMENTO:* ${payment}`;
            if (payment === 'Dinheiro' && troco) text += ` (Troco para R$ ${troco})`;
            
            text += "%0A%0A*📍 DADOS DA ENTREGA:*%0A";
            text += `*Nome:* ${name}%0A*Endereço:* ${address}%0A`;

            window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
        }

        loadMenuFromSheet();
    </script>
</body>
</html>
