<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital - Gorillaz Burguer</title>
    <style>
        :root {
            --primary: #f59e0b;
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-light: #f8fafc;
            --success: #10b981;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-light); 
            margin: 0; 
            padding: 0; 
            padding-bottom: 80px;
        }
        header { 
            background: #000; 
            padding: 20px; 
            text-align: center; 
            border-bottom: 3px solid var(--primary); 
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 { margin: 0; color: var(--primary); font-size: 24px;}
        header p { margin: 5px 0 0 0; color: #aaa; font-size: 14px;}
        
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        
        .category { 
            font-size: 1.2em; 
            font-weight: bold; 
            margin-top: 25px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 8px; 
            color: var(--primary); 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* NOVO LAYOUT DO ITEM COM FOTO */
        .item { 
            display: flex; 
            background: var(--bg-card); 
            padding: 15px; 
            margin-top: 12px; 
            border-radius: 8px; 
            border: 1px solid #2a2a2a;
            gap: 15px;
            align-items: center;
        }
        .item-img {
            width: 90px;
            height: 90px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #333;
            flex-shrink: 0;
        }
        .item-info { flex: 1; }
        .item-info h3 { margin: 0 0 5px 0; font-size: 16px; color: #fff;}
        .item-info p { 
            margin: 0; font-size: 13px; color: #94a3b8; line-height: 1.4; 
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .price { font-weight: bold; color: var(--success); font-size: 16px;}
        
        .btn-add { 
            background: var(--primary); 
            color: #000; 
            border: none; 
            padding: 8px 15px; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s;
        }
        .btn-add:active { transform: scale(0.95); }
        
        /* Carrinho Flutuante */
        .cart-bar { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            background: var(--primary); 
            color: #000; 
            padding: 18px; 
            text-align: center; 
            font-weight: bold; 
            cursor: pointer; 
            box-sizing: border-box; 
            font-size: 1.1em; 
            display: none; 
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
            z-index: 999;
        }
        
        /* Modal do Carrinho */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.85); 
            z-index: 1000; 
            overflow-y: auto;
        }
        .modal-content { 
            background: var(--bg-card); 
            max-width: 500px; 
            margin: 0 auto; 
            min-height: 100vh;
            padding: 20px; 
            box-sizing: border-box;
        }
        .close { 
            float: right; 
            font-size: 28px; 
            cursor: pointer; 
            color: var(--primary); 
            line-height: 1;
        }
        
        .cart-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 15px; 
            border-bottom: 1px dashed #333; 
            padding-bottom: 15px; 
        }
        .cart-controls button {
            padding: 8px 12px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; }
        input, select { 
            width: 100%; 
            padding: 12px; 
            border-radius: 6px; 
            border: 1px solid #475569; 
            background: #0f172a; 
            color: white; 
            box-sizing: border-box;
            font-size: 16px;
        }
        
        .btn-send { 
            background: var(--success); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 18px; 
            font-size: 1.1em; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>
    <header>
        <h1>🦍 GORILLAZ BURGUER</h1>
        <p>O melhor delivery de Parnaíba!</p>
    </header>
    
    <div class="container">
        <div id="menu-items">
            <p style="text-align: center; color: var(--primary); font-weight: bold;">Carregando cardápio direto da cozinha...</p>
        </div>
    </div>

    <!-- Barra inferior do carrinho -->
    <div class="cart-bar" id="cart-bar" onclick="openCart()">
        🛒 Ver Pedido (<span id="cart-count">0</span>) - R$ <span id="cart-total-bar">0.00</span>
    </div>

    <!-- Tela do Carrinho (Modal) -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <span class="close" onclick="closeCart()">&times;</span>
            <h2 style="color: var(--primary); margin-top: 0;">Seu Pedido</h2>
            
            <div id="cart-items-list"></div>
            
            <h3 style="display: flex; justify-content: space-between; border-bottom: 2px solid #333; padding-bottom: 10px;">
                <span>Total:</span> 
                <span style="color: var(--success);">R$ <span id="cart-total-modal">0.00</span></span>
            </h3>
            
            <h3 style="color: var(--primary); margin-top: 25px;">Para Onde Vamos Mandar?</h3>
            <div class="form-group">
                <label>Seu Nome</label>
                <input type="text" id="c-name" placeholder="Como devemos te chamar?">
            </div>
            <div class="form-group">
                <label>Endereço Completo (Rua, Número, Bairro)</label>
                <input type="text" id="c-address" placeholder="Ex: Rua A, 123 - Centro">
            </div>
            <div class="form-group">
                <label>Observação (Opcional)</label>
                <input type="text" id="c-obs" placeholder="Ex: Tirar cebola, ponto da carne...">
            </div>
            
            <h3 style="color: var(--primary); margin-top: 25px;">Pagamento</h3>
            <div class="form-group">
                <label>Forma de Pagamento na Entrega</label>
                <select id="c-payment">
                    <option value="PIX">PIX</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
            </div>
            <div class="form-group" id="troco-div" style="display:none;">
                <label>Precisa de troco para quanto?</label>
                <input type="number" id="c-troco" placeholder="Ex: 50">
            </div>

            <button class="btn-send" onclick="sendOrder()">Enviar Pedido no WhatsApp 📱</button>
        </div>
    </div>

    <script>
        // CONFIGURAÇÕES INICIAIS
        const phone = "5586994466786"; 
        
        // 👉 COLE O ID DA SUA PLANILHA AQUI DENTRO DAS ASPAS
        const SHEET_ID = "1o-DiM4TXG8U--60V2oMdDYcngW9Lq9zEHsscflODR3Y"; 
        
        let menu = [];
        let cart = [];

        async function loadMenuFromSheet() {
            if (SHEET_ID === "1o-DiM4TXG8U--60V2oMdDYcngW9Lq9zEHsscflODR3Y") {
                document.getElementById('menu-items').innerHTML = '<p style="text-align:center; color:#ef4444;">⚠️ Atenção Chefe! Você precisa colocar o ID da Planilha no código HTML.</p>';
                return;
            }

            try {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
                const response = await fetch(url);
                const text = await response.text();
                
                const jsonStr = text.substring(47).slice(0, -2);
                const data = JSON.parse(jsonStr);
                const rows = data.table.rows;
                const newMenu = [];
                
                rows.forEach(row => {
                    if(!row.c[0] || row.c[0].v === null) return; 
                    
                    const id = row.c[0].v;
                    const category = row.c[1] ? row.c[1].v : 'Gorillaz Menu';
                    const name = row.c[2] ? row.c[2].v : '';
                    const desc = row.c[3] ? row.c[3].v : '';
                    const price = row.c[4] ? parseFloat(row.c[4].v) : 0;
                    const disponivel = row.c[5] ? row.c[5].v : '';
                    
                    // 👉 NOVA COLUNA G (Índice 6) - LÊ A IMAGEM
                    // Se não tiver imagem na planilha, ele usa uma imagem preta padrão
                    const img = row.c[6] ? row.c[6].v : 'https://via.placeholder.com/150/1e1e1e/f59e0b?text=Gorillaz';
                    
                    if(disponivel.toString().toUpperCase() === 'SIM') {
                        newMenu.push({ id, category, name, desc, price, img });
                    }
                });
                
                menu = newMenu;
                renderMenu();
                
            } catch (error) {
                console.error("Erro:", error);
                document.getElementById('menu-items').innerHTML = '<p style="text-align:center; color:#ef4444;">Erro ao carregar o cardápio. Verifique se você publicou a planilha (Acesso Público).</p>';
            }
        }

        function renderMenu() {
            let html = '';
            let currentCategory = '';
            
            if(menu.length === 0) {
                document.getElementById('menu-items').innerHTML = '<p style="text-align:center;">Nenhum produto disponível no momento.</p>';
                return;
            }
            
            menu.forEach(item => {
                if (item.category !== currentCategory) {
                    html += `<div class="category">${item.category}</div>`;
                    currentCategory = item.category;
                }
                html += `
                    <div class="item">
                        <img src="${item.img}" class="item-img" alt="${item.name}">
                        <div class="item-info">
                            <h3>${item.name}</h3>
                            <p>${item.desc}</p>
                            <div class="price-row">
                                <span class="price">R$ ${item.price.toFixed(2)}</span>
                                <button class="btn-add" onclick="addToCart(${item.id}, event)">+ Add</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('menu-items').innerHTML = html;
        }

        function addToCart(id, event) {
            const item = menu.find(i => i.id === id);
            const cartItem = cart.find(i => i.id === id);
            
            if (cartItem) cartItem.qtd++;
            else cart.push({ ...item, qtd: 1 });
            
            updateCart();
            
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "✓ Add";
            btn.style.background = "#10b981";
            btn.style.color = "white";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = "var(--primary)";
                btn.style.color = "#000";
            }, 1000);
        }

        function updateCart() {
            let count = 0; let total = 0;
            cart.forEach(item => { count += item.qtd; total += item.price * item.qtd; });
            
            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-total-bar').innerText = total.toFixed(2);
            document.getElementById('cart-total-modal').innerText = total.toFixed(2);
            
            document.getElementById('cart-bar').style.display = count > 0 ? 'block' : 'none';
            if(count === 0) closeCart();
            renderCartItems();
        }

        function renderCartItems() {
            let html = '';
            cart.forEach((item, index) => {
                html += `
                    <div class="cart-item">
                        <div>
                            <div style="font-weight: bold; color: #fff;">${item.name}</div>
                            <div style="color: var(--success); font-weight: bold; margin-top: 5px;">
                                R$ ${(item.price * item.qtd).toFixed(2)} 
                                <span style="color: #64748b; font-size: 12px; font-weight: normal;">(R$ ${item.price.toFixed(2)} un)</span>
                            </div>
                        </div>
                        <div class="cart-controls">
                            <button onclick="changeQtd(${index}, -1)">-</button>
                            <span style="margin: 0 10px; font-weight: bold;">${item.qtd}</span>
                            <button onclick="changeQtd(${index}, 1)">+</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('cart-items-list').innerHTML = html || '<p style="color: #64748b;">Seu carrinho está vazio.</p>';
        }

        function changeQtd(index, delta) {
            cart[index].qtd += delta;
            if (cart[index].qtd <= 0) cart.splice(index, 1);
            updateCart();
        }

        function openCart() { 
            document.getElementById('cart-modal').style.display = 'block'; 
            document.body.style.overflow = 'hidden'; 
        }
        
        function closeCart() { 
            document.getElementById('cart-modal').style.display = 'none'; 
            document.body.style.overflow = 'auto';
        }

        document.getElementById('c-payment').addEventListener('change', function() {
            document.getElementById('troco-div').style.display = this.value === 'Dinheiro' ? 'block' : 'none';
        });

        function sendOrder() {
            const name = document.getElementById('c-name').value.trim();
            const address = document.getElementById('c-address').value.trim();
            const obs = document.getElementById('c-obs').value.trim();
            const payment = document.getElementById('c-payment').value;
            const troco = document.getElementById('c-troco').value;

            if (!name || !address) {
                alert("🦍 Chefe, preencha seu nome e endereço para a gente entregar!");
                return;
            }

            let text = "🦍 *NOVO PEDIDO - GORILLAZ BURGUER* 🦍%0A%0A";
            text += "*🛒 ITENS DO PEDIDO:*%0A";
            let total = 0;
            cart.forEach(item => {
                text += `▪️ ${item.qtd}x ${item.name} - R$ ${(item.price * item.qtd).toFixed(2)}%0A`;
                total += item.price * item.qtd;
            });
            
            text += `%0A*💰 TOTAL:* R$ ${total.toFixed(2)}%0A`;
            text += `*💳 PAGAMENTO:* ${payment}`;
            if (payment === 'Dinheiro' && troco) text += ` (Troco para R$ ${troco})`;
            
            text += "%0A%0A*📍 DADOS DA ENTREGA:*%0A";
            text += `*Nome:* ${name}%0A*Endereço:* ${address}%0A`;
            if (obs) text += `*Observação:* ${obs}%0A`;

            window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
        }

        loadMenuFromSheet();
    </script>
</body>
</html>
